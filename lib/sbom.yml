# Software bill of materials for vendored third-party code.
#
# One entry per vendored component, keyed by its path relative to the repo root
# (a directory, or a file when one directory mixes several upstreams).
# Kept in one central file (not one per library) so that git-subrepo directories
# stay byte-identical to their upstream.
#
# Field names follow ESP-IDF's sbom.yml where an equivalent exists.
#   name             component name
#   version          upstream release the code is based on
#   repository       upstream git repository
#   url              download location, for code that comes as an archive or binary
#                    rather than from a repository (at least one of the two is required)
#   upstream_commit  upstream commit the code is based on, i.e. BEFORE local
#                    patches. Not the git-subrepo HEAD when that points at a fork.
#   subrepo_commit   the `commit` from the directory's .gitrepo, if it has one. The
#                    hook fails when they differ, so a `git subrepo pull` forces a
#                    review of this entry.
#   cpe              CPE 2.3 name(s) as used in the NVD dictionary (Grype matches on
#                    this). A list when NVD files the product under several vendors.
#   first_party      true for Prusa's own projects (not scanned against NVD)
#   purl             package URL (OSV matches on this)
#   supplier         "Organization: <name>" as in SPDX/ESP-IDF
#   license          SPDX license expression
#   patches          local modifications relative to upstream_commit
#   cve-exclude-list CVEs that match by version but do not apply; {cve, reason}
#                    (the detailed justification lives in the VEX file)
#   note             anything a reviewer needs to know about the identity above
#
# Checked by utils/check_sbom_manifest.py (schema: lib/sbom.schema.json).

components:
  lib/Middlewares/Third_Party/mbedtls:
    name: mbedtls
    version: 2.28.0
    repository: https://github.com/Mbed-TLS/mbedtls
    upstream_commit: 8b3f26a5ac38d4fdccbc5c5366229f3e01dafcc0  # tag v2.28.0
    subrepo_commit: 8b3f26a5ac38d4fdccbc5c5366229f3e01dafcc0
    cpe:
      - cpe:2.3:a:arm:mbed_tls:2.28.0:*:*:*:*:*:*:*
      - cpe:2.3:a:trustedfirmware:mbed_tls:2.28.0:*:*:*:*:*:*:*
    purl: pkg:github/mbed-tls/mbedtls@v2.28.0
    supplier: "Organization: Trusted Firmware (formerly Arm)"
    license: Apache-2.0 OR GPL-2.0-or-later
    note: >-
      NVD files mbed TLS under two CPE vendors, arm:mbed_tls and
      trustedfirmware:mbed_tls, with disjoint CVE sets; both are listed. The 2.28 LTS branch
      reached end of life with 2.28.10.
    patches:
      - library/platform_util.c: use gmtime_r() instead of gmtime()+memcpy
      - include/mbedtls/net_sockets.h: make mbedtls_net_context an opaque struct
      # Visual Studio project files differ only in line endings.

