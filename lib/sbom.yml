  lib/WUI/mdns:
    name: lwip-mdns
    version: 2.2.0-67-g347054b3
    repository: https://git.savannah.nongnu.org/git/lwip.git
    upstream_commit: 347054b329d141b858cc7180bf2aa23c672dc6d7  # master, STABLE-2_2_0_RELEASE-67
    cpe: cpe:2.3:a:lwip_project:lwip:2.2.0:*:*:*:*:*:*:*
    purl: pkg:generic/lwip@2.2.0?vcs_url=git%2Bhttps://git.savannah.nongnu.org/git/lwip.git%40347054b329d141b858cc7180bf2aa23c672dc6d7
    supplier: "Organization: lwIP project (Savannah)"
    license: BSD-3-Clause
    note: >-
      lwIP's mDNS responder app (src/apps/mdns + include/lwip/apps/mdns*.h),
      imported separately in 7262f1e56 (2024-02-07) because the main lwIP copy
      (lib/Middlewares/Third_Party/LwIP, 2.1.2) has no src/apps. README names
      347054b3. Verified: the import commit equals upstream 347054b3 after
      clang-format with the repo style (0 differing lines in all 8 files); the
      mdns files are identical in every upstream commit from 5e45328b
      (2023-10-14) through STABLE-2_2_1_RELEASE, up to ab2f69c7 (2026-05-26). The
      mirror https://github.com/lwip-tcpip/lwip has the same commits. The cpe uses
      2.2.0, the last release before 347054b3. NVD has lwip_project:lwip but no
      2.2.0 dictionary entry (the newest is 2.1.2; checked 2026-11-03).
      LWIP_MDNS_SEARCH stays at its default of 1, so the search/response code is compiled.
    patches:
      - "all files: clang-formatted; includes changed from lwip/apps/... to local and <lwip/...>"
      - "mdns.c, mdns_out.c, mdns_domain.[ch], mdns_priv.h: hostname comes from netif->hostname (per-host name buffer and txt_fn removed); service records are const and static"
      - "mdns.c, mdns.h: mdns_resp_add_netif() has no hostname argument; mdns_resp_add_service_prusalink() hard-codes _prusalink._tcp:80; dynamic add/del/rename service API #if 0'd"
      - "mdns.c: mdns_resp_remove_netif() also cancels pending probe/announce timeouts (3cb24025f)"
      - "mdns.c: ip_addr_eq/ip4_addr_net_eq renamed back to ip_addr_cmp/ip_addr_netcmp for lwIP 2.1.2"
      - "all files: '#error dead code' marker comments (BFW-5461)"
    cve-exclude-list:
      - cve: CVE-2026-112062
        reason: >-
          The vulnerable memcpy in mdns_handle_response() (lib/WUI/mdns/mdns.c:1864,
          fixed upstream in ab2f69c7) runs only for answers that match a pending
          search request. Requests are created only by mdns_search_service(),
          which the firmware never calls (only mdns_resp_init, mdns_resp_add_netif,
          mdns_resp_add_service_prusalink and mdns_resp_remove_netif are used, in lib/WUI/wui.cpp).

